<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Builder v3 · Components</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:radial-gradient(1100px 520px at 88% -8%,#e2ebff 0,rgba(226,235,255,0) 62%),linear-gradient(180deg,#eef2f9 0,#f4f6fa 520px);background-attachment:fixed;color:#101828;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d4d9e1;border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
@keyframes omFade{from{opacity:0}to{opacity:1}}
@keyframes omSlide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes omPop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #5b86f5;outline-offset:2px}
::selection{background:#d6e2fb}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="min-height:100vh;display:flex;flex-wrap:wrap">

<aside style="position:sticky;top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);border-radius:20px;flex:0 0 248px;background:radial-gradient(420px 260px at 0 0,rgba(79,124,240,.28) 0,rgba(79,124,240,0) 70%),linear-gradient(180deg,#1a2b5c 0,#14224a 45%,#0f1a3a 100%);color:#d3dbef;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.06);box-shadow:0 20px 40px -18px rgba(15,26,58,.55),0 2px 6px rgba(15,26,58,.18),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden;z-index:25">
  <div style="display:flex;align-items:center;gap:10px;padding:18px 16px 14px;min-height:68px">
    <div style="flex:none;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#5b86f5,#2550ad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 4px 12px -2px rgba(47,98,201,.55),inset 0 1px 0 rgba(255,255,255,.25)">MR</div>
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0;flex:1">
      <span style="font-size:14.5px;font-weight:700;color:#fff;white-space:nowrap">Risk Analytics</span>
      <span style="align-self:flex-start;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#f0d48f;border:1px solid rgba(240,212,143,.4);background:rgba(240,212,143,.1);padding:1px 6px;border-radius:999px">UAT</span>
    </div>
  </div>
  <nav aria-label="Dashboards" style="flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ nav }}" as="g" hint-placeholder-count="5">
      <sc-if value="{{ g.isHead }}" hint-placeholder-val="{{ false }}"><div style="padding:14px 8px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#8392bb">{{ g.label }}</div></sc-if>
      <sc-if value="{{ g.isItem }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ g.onClick }}" style="display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;cursor:pointer;border-radius:11px;padding:7px 10px 7px 8px;background:{{ g.bg }};color:{{ g.fg }};font-size:13px;font-weight:{{ g.fw }};box-shadow:{{ g.sh }};transition:background .18s ease,color .18s ease" style-hover="background:{{ g.hov }};color:#ffffff">
          <span style="flex:none;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:{{ g.icoBg }};color:{{ g.icoFg }}"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="{{ g.icon }}"></path></svg></span>
          <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ g.label }}</span>
          <sc-if value="{{ g.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="flex:none;font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px;background:#f0d48f;color:#3d2c00">{{ g.badge }}</span></sc-if>
        </button>
      </sc-if>
    </sc-for>
  </nav>
  <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;line-height:1.45;color:#8392bb">Figures in $MM. Intercompany exposures excluded.</div>
</aside>

<div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;padding:0 20px 0 16px">

<div style="position:sticky;top:0;z-index:40;margin:0 -20px 4px -16px;padding:12px 20px 10px 16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(238,242,249,.95),rgba(238,242,249,.86));backdrop-filter:saturate(170%) blur(14px);-webkit-backdrop-filter:saturate(170%) blur(14px)">
<header style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
  <div style="display:flex;flex-direction:column;gap:3px;min-width:220px;flex:1 1 260px">
    <div style="display:flex;gap:6px;font-size:12px;color:#667085;white-space:nowrap"><span>My dashboards</span><span style="color:#b0b8c6">/</span><span>{{ crumb }}</span></div>
    <div style="display:flex;align-items:center;gap:10px;min-width:0">
      <sc-if value="{{ isView }}" hint-placeholder-val="{{ true }}">
        <h1 style="margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#0f1a3a">{{ dashName }}</h1>
        <button onClick="{{ openHistory }}" title="Version history" style="flex:none;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#475467;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid #e2e8f2;cursor:pointer;font-family:'IBM Plex Mono',monospace" style-hover="border-color:#bcd0f5;color:#1d4596"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"></path></svg>{{ verLabel }}</button>
      </sc-if>
      <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
        <label style="display:flex;flex:1;min-width:0"><span class="vh">Dashboard name</span><input value="{{ dashName }}" onChange="{{ onName }}" style="flex:1;min-width:0;max-width:420px;height:36px;padding:0 12px;border:1px solid #bcd0f5;border-radius:10px;background:#fff;font-size:19px;font-weight:700;letter-spacing:-0.02em;color:#0f1a3a;box-shadow:0 0 0 3px rgba(91,134,245,.12)"></label>
        <span style="flex:none;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:#2f62c9;background:#e8efff;border:1px solid #c9d7f5;padding:3px 8px;border-radius:999px">EDITING</span>
      </sc-if>
    </div>
  </div>
  <div style="flex:0 1 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;margin-left:auto">
    <div style="flex:none;display:flex;align-items:center;gap:9px;height:42px;padding:0 12px;background:#fff;border:1px solid #e2e8f2;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);color:#2f62c9">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="flex:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>
      <span style="display:flex;flex-direction:column;gap:1px"><span style="font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#667085">COB</span><span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:#101828">11-Sep-2026</span></span>
    </div>
    <div style="flex:none;display:flex;align-items:center;gap:9px;height:42px;padding:0 12px;background:#fff;border:1px solid #e2e8f2;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);color:#2f62c9">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="flex:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M7 7h13M17 4l3 3-3 3M17 17H4M7 14l-3 3 3 3"></path></svg>
      <span style="display:flex;flex-direction:column;gap:1px"><span style="font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#667085">PCOB · {{ compareLabel }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:#101828">{{ pcob }}</span></span>
    </div>
    <sc-if value="{{ isView }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ openJson }}" title="Show the saved document" style="display:flex;align-items:center;gap:7px;flex:none;height:42px;padding:0 12px;border:1px solid #e2e8f2;background:#fff;color:#475467;border-radius:12px;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);font-size:12.5px;font-weight:600" style-hover="color:#2f62c9;border-color:#bcd0f5"><span style="font-family:'IBM Plex Mono',monospace;font-size:13px">{ }</span>JSON</button>
      <button onClick="{{ startEdit }}" disabled="{{ isPreview }}" style="display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border:0;border-radius:12px;background:linear-gradient(180deg,#2c4ea3,#1a2b5c);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;opacity:{{ editOp }};box-shadow:0 8px 18px -8px rgba(26,43,92,.7)" style-hover="filter:brightness(1.08)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Edit dashboard</button>
    </sc-if>
    <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
      <div style="flex:none;display:flex;gap:2px;padding:3px;background:#fff;border:1px solid #e2e8f2;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05)">
        <button onClick="{{ undo }}" disabled="{{ noUndo }}" aria-label="Undo" title="Undo" style="width:36px;height:34px;border:0;border-radius:9px;background:transparent;color:#475467;cursor:pointer;opacity:{{ undoOp }};display:flex;align-items:center;justify-content:center" style-hover="background:#f3f6fc"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
        <button onClick="{{ redo }}" disabled="{{ noRedo }}" aria-label="Redo" title="Redo" style="width:36px;height:34px;border:0;border-radius:9px;background:transparent;color:#475467;cursor:pointer;opacity:{{ redoOp }};display:flex;align-items:center;justify-content:center" style-hover="background:#f3f6fc"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="m15 14 5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
      </div>
      <span style="font-size:12px;color:#667085;white-space:nowrap">{{ draftNote }}</span>
      <button onClick="{{ openAdd }}" style="display:flex;align-items:center;gap:7px;height:42px;padding:0 14px;border:1px solid #bcd0f5;border-radius:12px;background:#eef3fd;color:#1d4596;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="background:#e1eafc"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2.2;stroke-linecap:round"><path d="M12 5v14M5 12h14"></path></svg>Components</button>
      <button onClick="{{ cancelEdit }}" style="height:42px;padding:0 14px;border:1px solid #e2e8f2;border-radius:12px;background:#fff;color:#344054;font-size:13px;font-weight:600;cursor:pointer" style-hover="border-color:#bcd0f5">Cancel</button>
      <button onClick="{{ save }}" style="display:flex;align-items:center;gap:7px;height:42px;padding:0 18px;border:0;border-radius:12px;background:linear-gradient(180deg,#2c4ea3,#1a2b5c);color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 8px 18px -8px rgba(26,43,92,.7)" style-hover="filter:brightness(1.08)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M20 6 9 17l-5-5"></path></svg>Save</button>
    </sc-if>
  </div>
</header>

<sc-if value="{{ isPreview }}" hint-placeholder-val="{{ false }}">
  <div role="status" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#fff7e6;border:1px solid #fedf89;color:#93370d;font-size:13px">
    <b>Previewing {{ previewLabel }}</b><span>Read-only. The current version is unchanged until you restore.</span><span style="flex:1"></span>
    <button onClick="{{ exitPreview }}" style="height:32px;padding:0 12px;border:1px solid #fedf89;border-radius:9px;background:#fff;color:#93370d;font-size:12.5px;font-weight:600;cursor:pointer">Back to current</button>
    <button onClick="{{ restorePreview }}" style="height:32px;padding:0 14px;border:0;border-radius:9px;background:#b54708;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer">Restore this version</button>
  </div>
</sc-if>

<sc-if value="{{ showTop }}" hint-placeholder-val="{{ true }}">
<div onDragOver="{{ topOver }}" onDrop="{{ topDrop }}" style="background:radial-gradient(600px 120px at 0 0,rgba(91,134,245,.22) 0,rgba(91,134,245,0) 70%),linear-gradient(180deg,#1a2b5c,#101c40);border:1px {{ topBdStyle }} {{ topBd }};border-radius:18px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;box-shadow:0 18px 36px -18px rgba(15,26,58,.75),0 2px 4px rgba(15,26,58,.12),inset 0 1px 0 rgba(255,255,255,.08)">
  <sc-if value="{{ topEmpty }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#8fa0cc;padding:8px 6px">Top bar · drag Filter, Button or Cross-filter chips components here</span></sc-if>
  <sc-for list="{{ topItems }}" as="it" hint-placeholder-count="4">
    <sc-if value="{{ it.isFilter }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:10px;padding:3px 10px 3px 3px;min-height:38px;border-radius:12px;background:{{ it.secBg }};border:1px solid {{ it.secBd }}">
        <button onClick="{{ it.onLabel }}" title="{{ it.tip }}" style="align-self:stretch;display:flex;align-items:center;gap:6px;padding:0 8px;border:0;border-radius:9px;background:rgba(91,134,245,.16);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a9c0ff;white-space:nowrap;cursor:{{ it.cur }}">{{ it.label }}<sc-if value="{{ it.showCount }}" hint-placeholder-val="{{ false }}"><span style="min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:{{ it.cntBg }};color:#fff;font-size:10px;letter-spacing:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace">{{ it.count }}</span></sc-if><sc-if value="{{ it.isEdit }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></sc-if></button>
        <div style="display:flex;flex-wrap:wrap;gap:2px;padding:2px;background:rgba(6,14,38,.38);border:1px solid rgba(255,255,255,.07);border-radius:10px">
          <sc-for list="{{ it.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="border:0;height:28px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};box-shadow:{{ o.sh }};transition:background .2s ease,color .2s ease" style-hover="color:#ffffff">{{ o.label }}</button></sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ it.isButton }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:4px"><button onClick="{{ it.onClick }}" title="{{ it.tip }}" style="display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;border:1px solid {{ it.bd }};background:{{ it.bg }};color:{{ it.fg }};font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="filter:brightness(1.1)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ it.icon }}"></path></svg>{{ it.label }}</button><sc-if value="{{ it.isEdit }}" hint-placeholder-val="{{ false }}"><button onClick="{{ it.onCfg }}" aria-label="Configure button" style="width:26px;height:26px;border:0;border-radius:7px;background:rgba(255,255,255,.08);color:#a9c0ff;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2.2;stroke-linecap:round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button></sc-if></div>
    </sc-if>
    <sc-if value="{{ it.isChips }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:34px;padding:4px 6px;border-top:1px solid rgba(255,255,255,.07);margin-top:2px">
        <span style="display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.09em;color:#8fa6e0;white-space:nowrap"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" aria-hidden="true" style="flex:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 5h16l-6 8v6l-4-2v-4L4 5z"></path></svg>CROSS-FILTERS</span>
        <sc-if value="{{ it.none }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;color:#8fa0cc">{{ it.hint }}</span></sc-if>
        <sc-for list="{{ it.chips }}" as="c" hint-placeholder-count="0">
          <div title="{{ c.tip }}" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 10px;background:#fff;border-radius:999px;box-shadow:0 6px 14px -6px rgba(0,0,0,.45);animation:omFade .2s ease both">
            <span style="width:8px;height:8px;border-radius:3px;background:{{ c.dot }}"></span><span style="font-size:10px;color:#2f62c9;font-weight:700;letter-spacing:.06em">{{ c.kind }}</span>
            <span style="font-size:12.5px;font-weight:600;color:#0f1a3a;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis">{{ c.value }}</span><span style="font-size:11px;color:#667085;white-space:nowrap">→ {{ c.applies }}</span>
            <button onClick="{{ c.clear }}" aria-label="Remove cross-filter" style="width:22px;height:22px;border-radius:50%;border:0;background:#eef3fd;color:#2f62c9;cursor:pointer;font-size:13px;line-height:1">×</button>
          </div>
        </sc-for>
        <span style="flex:1"></span>
        <sc-if value="{{ it.any }}" hint-placeholder-val="{{ false }}"><button onClick="{{ it.clearAll }}" style="border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#dbe4fb;font-size:12px;font-weight:600;cursor:pointer;height:28px;padding:0 12px;border-radius:999px">Clear all</button></sc-if>
        <sc-if value="{{ it.isEdit }}" hint-placeholder-val="{{ false }}"><button onClick="{{ it.onCfg }}" aria-label="Configure chips" style="width:26px;height:26px;border:0;border-radius:7px;background:rgba(255,255,255,.08);color:#a9c0ff;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2.2;stroke-linecap:round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button></sc-if>
      </div>
    </sc-if>
  </sc-for>
</div>
</sc-if>
</div>

<nav aria-label="Dashboard tabs" style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px;margin:6px 0 0;border-bottom:1px solid #dfe5ef">
  <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="2">
    <div onDragOver="{{ tb.onOver }}" onDrop="{{ tb.onDrop }}" style="display:flex;align-items:center;gap:6px;margin-bottom:-1px;padding:0 4px;border-radius:12px 12px 0 0;border:1px solid {{ tb.bd }};border-bottom-color:{{ tb.bdb }};background:{{ tb.bg }};box-shadow:{{ tb.sh }}">
      <sc-if value="{{ tb.editing }}" hint-placeholder-val="{{ false }}"><label style="display:flex"><span class="vh">Tab name</span><input value="{{ tb.name }}" onChange="{{ tb.onName }}" style="width:150px;height:30px;margin:5px 0 5px 6px;padding:0 8px;border:1px solid #bcd0f5;border-radius:8px;font-size:13px;font-weight:600;color:#0f1a3a"></label></sc-if>
      <sc-if value="{{ tb.plain }}" hint-placeholder-val="{{ true }}"><button onClick="{{ tb.onClick }}" style="height:40px;padding:0 10px;border:0;background:transparent;font-size:13.5px;font-weight:{{ tb.fw }};color:{{ tb.fg }};cursor:pointer;white-space:nowrap">{{ tb.name }}</button></sc-if>

    </div>
  </sc-if>
  <sc-if value="{{ isView }}" hint-placeholder-val="{{ true }}"><span style="flex:1"></span><span style="font-size:11.5px;color:#667085;margin-bottom:10px">{{ hiddenNote }}</span></sc-if>
</nav>

<main style="display:flex;flex-direction:column;gap:14px;padding:{{ mainPad }};margin:12px 0 24px;border-radius:20px;background:{{ mainBg }};border:{{ mainBd }}">
  <sc-if value="{{ isEmptyTab }}" hint-placeholder-val="{{ false }}"><section style="padding:40px 20px;text-align:center;font-size:13.5px;color:#475467">{{ emptyTabNote }}</section></sc-if>

    <sc-if value="{{ dragging }}" hint-placeholder-val="{{ false }}"><div onDragOver="{{ row.zone.onOver }}" onDrop="{{ row.zone.onDrop }}" style="height:40px;border:2px dashed {{ row.zone.bd }};border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#2f62c9;background:{{ row.zone.bg }}">Drop here for a new row</div></sc-if>
    <section style="display:flex;flex-wrap:wrap;gap:14px;align-items:stretch">
      <sc-for list="{{ row.cards }}" as="c" hint-placeholder-count="2">
        <div draggable="{{ c.dragAttr }}" onDragStart="{{ c.onDragStart }}" onDragEnd="{{ onDragEnd }}" onDragOver="{{ c.onOver }}" onDrop="{{ c.onDrop }}" style="position:relative;flex:{{ c.flex }};min-width:{{ c.minW }}px;max-width:100%;background:{{ c.bg }};border:1px {{ c.bdStyle }} {{ c.bd }};border-radius:16px;box-shadow:{{ c.sh }};display:flex;flex-direction:column;overflow:hidden;opacity:{{ c.op }};transition:box-shadow .15s ease,opacity .15s ease">
          <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:#f5f8ff;border-bottom:1px dashed #c9d7f5">
              <span title="Drag to move, or drop on a tab name" style="display:flex;align-items:center;justify-content:center;width:22px;height:28px;color:#5b7fc9;cursor:grab"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></span>
              <span style="display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;background:#e8efff;color:#1d4596;font-size:11px;font-weight:700;letter-spacing:.03em;white-space:nowrap"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ c.kIcon }}"></path></svg>{{ c.kLabel }}</span>
              <button onClick="{{ c.onLeft }}" aria-label="Move left" style="width:26px;height:26px;border:1px solid #dbe4f6;border-radius:7px;background:#fff;color:#475467;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 6l-6 6 6 6"></path></svg></button>
              <button onClick="{{ c.onRight }}" aria-label="Move right" style="width:26px;height:26px;border:1px solid #dbe4f6;border-radius:7px;background:#fff;color:#475467;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 6l6 6-6 6"></path></svg></button>
              <sc-if value="{{ c.showSpans }}" hint-placeholder-val="{{ true }}"><div role="group" aria-label="Width" style="display:flex;gap:1px;padding:2px;background:#fff;border:1px solid #dbe4f6;border-radius:9px"><sc-for list="{{ c.spans }}" as="o" hint-placeholder-count="5"><button onClick="{{ o.onClick }}" title="{{ o.tip }}" style="min-width:28px;height:22px;padding:0 5px;border:0;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button></sc-for></div></sc-if>
              <sc-if value="{{ c.canH }}" hint-placeholder-val="{{ true }}"><div role="group" aria-label="Height" style="display:flex;gap:1px;padding:2px;background:#fff;border:1px solid #dbe4f6;border-radius:9px"><sc-for list="{{ c.hs }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" title="{{ o.tip }}" style="min-width:24px;height:22px;padding:0 5px;border:0;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button></sc-for></div></sc-if>
              <span style="flex:1"></span>
              <button onClick="{{ c.onCfg }}" style="display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid #bcd0f5;border-radius:8px;background:#fff;color:#1d4596;font-size:12px;font-weight:600;cursor:pointer" style-hover="background:#eef3fd"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>Configure</button>
              <button onClick="{{ c.onMine }}" aria-label="Save as my component" title="Save as my component" style="width:28px;height:28px;border:1px solid #dbe4f6;border-radius:8px;background:#fff;color:#475467;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
              <button onClick="{{ c.onDup }}" aria-label="Duplicate" title="Duplicate" style="width:28px;height:28px;border:1px solid #dbe4f6;border-radius:8px;background:#fff;color:#475467;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M9 9h11v11H9zM5 15H4V4h11v1"></path></svg></button>
              <button onClick="{{ c.onDel }}" aria-label="Remove component" title="Remove" style="width:28px;height:28px;border:1px solid #f1d6d2;border-radius:8px;background:#fff;color:#b42318;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:#fdeceb"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>

          <sc-if value="{{ c.isHeader }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:{{ c.hdrPad }}"><h2 style="margin:0;font-size:17px;font-weight:700;color:#0f1a3a;letter-spacing:-0.01em;white-space:nowrap">{{ c.title }}</h2><span style="flex:1;height:1px;background:linear-gradient(90deg,#c9d4e8,rgba(201,212,232,0))"></span></div></sc-if>
          <sc-if value="{{ c.isDivider }}" hint-placeholder-val="{{ false }}"><div style="padding:{{ c.hdrPad }}"><div style="height:1px;background:#dfe5ef"></div></div></sc-if>

          <sc-if value="{{ c.isCard }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;padding:14px 16px 10px">
              <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex:1">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0;font-size:15px;font-weight:600;color:#101828;letter-spacing:-0.005em">{{ c.title }}</h2><sc-if value="{{ c.hasTag }}" hint-placeholder-val="{{ true }}"><span style="font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:{{ c.tagBg }};color:{{ c.tagFg }}">{{ c.tag }}</span></sc-if></div>
                <sc-if value="{{ c.hasSub }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;color:#667085">{{ c.sub }}</span></sc-if>
                <sc-if value="{{ c.hasChips }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:5px"><sc-for list="{{ c.chips }}" as="ch" hint-placeholder-count="1"><span title="{{ ch.tip }}" style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{ ch.bg }};color:{{ ch.fg }};border:1px solid {{ ch.bd }};white-space:nowrap"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ ch.icon }}"></path></svg>{{ ch.label }}</span></sc-for></div></sc-if>
              </div>
              <sc-if value="{{ c.showExport }}" hint-placeholder-val="{{ true }}"><button onClick="{{ c.onExport }}" aria-label="Export data" title="Export data" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;border:1px solid #e6ebf3;background:#fff;color:#667085;cursor:pointer" style-hover="color:#2f62c9;border-color:#bcd0f5;background:#f3f6fc"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg></button></sc-if>
            </div>
          </sc-if>

          <sc-if value="{{ c.isSetup }}" hint-placeholder-val="{{ false }}">
            <div style="padding:0 16px 16px;display:flex;flex-direction:column;gap:10px">
              <span style="font-size:12.5px;color:#475467">Choose the data for this {{ c.kLower }}. Datasets come from the services; fields and filters are read from their config.</span>
              <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px">
                <sc-for list="{{ c.dsList }}" as="ds" hint-placeholder-count="4"><button onClick="{{ ds.onPick }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px;border:1px solid #e2e8f2;border-radius:12px;background:#fff;cursor:pointer;text-align:left" style-hover="border-color:#5b86f5;background:#f8faff"><span style="display:flex;align-items:center;gap:6px"><b style="font-size:12.5px;color:#101828">{{ ds.label }}</b><span style="font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:{{ ds.tagBg }};color:{{ ds.tagFg }}">{{ ds.svc }}</span></span><span style="font-size:11px;color:#667085">{{ ds.meta }}</span></button></sc-for>
              </div>
            </div>
          </sc-if>

              <span style="font-size:12px;font-weight:600;color:{{ c.st.subFg }}">{{ c.st.sub }}</span>
              <sc-if value="{{ c.hasChips }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:2px"><sc-for list="{{ c.chips }}" as="ch" hint-placeholder-count="1"><span title="{{ ch.tip }}" style="font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:{{ ch.bg }};color:{{ ch.fg }};border:1px solid {{ ch.bd }};white-space:nowrap">{{ ch.label }}</span></sc-for></div></sc-if>

          <sc-if value="{{ c.isFilter }}" hint-placeholder-val="{{ false }}">

              <span style="font-size:11px;color:#667085">{{ c.fl.scopeNote }}</span>

          <sc-if value="{{ c.isButton }}" hint-placeholder-val="{{ false }}">

          </sc-if>

          <sc-if value="{{ c.isChips }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 16px 14px">
              <sc-if value="{{ c.cx.none }}" hint-placeholder-val="{{ true }}"><span style="font-size:12.5px;color:#667085">{{ c.cx.hint }}</span></sc-if>
              <sc-for list="{{ c.cx.chips }}" as="x" hint-placeholder-count="0"><span style="display:flex;align-items:center;gap:7px;height:30px;padding:0 4px 0 10px;border-radius:999px;background:#eef3fd;border:1px solid #c9d7f5"><span style="width:8px;height:8px;border-radius:3px;background:{{ x.dot }}"></span><b style="font-size:10px;color:#2f62c9;letter-spacing:.06em">{{ x.kind }}</b><span style="font-size:12.5px;font-weight:600;color:#0f1a3a">{{ x.value }}</span><button onClick="{{ x.clear }}" aria-label="Remove cross-filter" style="width:22px;height:22px;border-radius:50%;border:0;background:#fff;color:#2f62c9;cursor:pointer">×</button></span></sc-for>
            </div>
          </sc-if>

          <sc-if value="{{ c.isGrid }}" hint-placeholder-val="{{ false }}">
            <div style="height:{{ c.bodyH }};overflow:auto;border-top:1px solid #eef1f6">
              <div style="min-width:{{ c.g.minW }}px">
                <div style="position:sticky;top:0;z-index:3;background:#f8fafd;border-bottom:1px solid #e6ebf3">
                  <sc-if value="{{ c.g.hasBands }}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:{{ c.g.gtc }}"><sc-for list="{{ c.g.bands }}" as="b" hint-placeholder-count="4"><div style="grid-column:span {{ b.span }};position:{{ b.pos }};left:0;z-index:{{ b.z }};background:#f8fafd;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 8px 2px;font-size:11.5px;font-weight:700;color:{{ b.color }};white-space:nowrap;border-left:{{ b.bl }};box-shadow:{{ b.sh }}"><sc-if value="{{ b.hasDot }}" hint-placeholder-val="{{ true }}"><span style="width:7px;height:7px;border-radius:2px;background:{{ b.color }}"></span></sc-if>{{ b.label }}</div></sc-for></div></sc-if>
                  <div style="display:grid;grid-template-columns:{{ c.g.gtc }}"><sc-for list="{{ c.g.heads }}" as="h" hint-placeholder-count="8"><button onClick="{{ h.onSort }}" style="position:{{ h.pos }};left:0;z-index:{{ h.z }};display:flex;align-items:flex-end;justify-content:{{ h.just }};gap:4px;padding:7px 10px 8px {{ h.pl }}px;border:0;border-left:{{ h.bl }};background:#f8fafd;font-size:11px;font-weight:600;color:{{ h.fg }};white-space:nowrap;cursor:pointer;text-align:left">{{ h.label }}<span style="color:#98a2b3">{{ h.arrow }}</span></button></sc-for></div>
                </div>
                <sc-for list="{{ c.g.rows }}" as="r" hint-placeholder-count="10">
                  <div onClick="{{ r.onClick }}" style="display:grid;grid-template-columns:{{ c.g.gtc }};font-size:13px;border-bottom:1px solid #f1f3f7;cursor:{{ r.cur }};background:{{ r.bg }};box-shadow:{{ r.sh }}" style-hover="background:#f5f8fd">

                <sc-if value="{{ c.g.hasTot }}" hint-placeholder-val="{{ false }}"><div style="position:sticky;bottom:0;z-index:3;display:grid;grid-template-columns:{{ c.g.gtc }};background:#f5f8fc;border-top:1px solid #d9e0ea;box-shadow:0 -8px 16px -12px rgba(16,24,40,.2);font-size:13px"><sc-for list="{{ c.g.tot }}" as="x" hint-placeholder-count="8"><div style="position:{{ x.pos }};left:0;z-index:{{ x.z }};background:#f5f8fc;display:flex;align-items:center;justify-content:{{ x.just }};padding:9px 10px 9px {{ x.pl }}px;font-family:{{ x.ff }};color:{{ x.color }};font-weight:700;white-space:nowrap;border-left:{{ x.bl }};border-right:{{ x.br }}">{{ x.text }}</div></sc-for></div></sc-if>
              </div>
            </div>
          </sc-if>
