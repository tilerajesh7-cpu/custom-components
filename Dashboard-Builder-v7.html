<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Builder v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:radial-gradient(1100px 520px at 88% -8%,#e2ebff 0,rgba(226,235,255,0) 62%),linear-gradient(180deg,#eef2f9 0,#f4f6fa 520px);background-attachment:fixed;color:#101828;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d4d9e1;border-radius:10px;border:3px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
@keyframes omFade{from{opacity:0}to{opacity:1}}
@keyframes omUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes omPop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes omShimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes omSpin{to{transform:rotate(360deg)}}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #5b86f5;outline-offset:2px}
::selection{background:#d6e2fb}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sk{background:linear-gradient(90deg,#eef1f6 0,#f6f8fb 50%,#eef1f6 100%);background-size:800px 100%;animation:omShimmer 1.2s linear infinite;border-radius:6px}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div style="min-height:100vh;display:flex;align-items:flex-start;user-select:{{ selNone }};-webkit-user-select:{{ selNone }};cursor:{{ dragCursor }}">

<sc-if value="{{ isView }}" hint-placeholder-val="{{ true }}">
<aside style="position:sticky;top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);border-radius:20px;flex:0 0 236px;background:radial-gradient(420px 260px at 0 0,rgba(79,124,240,.28) 0,rgba(79,124,240,0) 70%),linear-gradient(180deg,#1a2b5c 0,#14224a 45%,#0f1a3a 100%);color:#d3dbef;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.06);box-shadow:0 20px 40px -18px rgba(15,26,58,.55);overflow:hidden;z-index:25">
  <div style="display:flex;align-items:center;gap:10px;padding:18px 16px 14px">
    <div style="flex:none;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#5b86f5,#2550ad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">MR</div>
    <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:14.5px;font-weight:700;color:#fff">Risk Analytics</span><span style="align-self:flex-start;font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#f0d48f;border:1px solid rgba(240,212,143,.4);background:rgba(240,212,143,.1);padding:1px 6px;border-radius:999px">UAT</span></div>
  </div>
  <nav aria-label="Dashboards" style="flex:1;overflow-y:auto;padding:6px 10px;display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ nav }}" as="g" hint-placeholder-count="4">
      <sc-if value="{{ g.isHead }}" hint-placeholder-val="{{ false }}"><div style="padding:14px 8px 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#8392bb">{{ g.label }}</div></sc-if>
      <sc-if value="{{ g.isItem }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ g.onClick }}" style="display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;cursor:pointer;border-radius:11px;padding:7px 10px 7px 8px;background:{{ g.bg }};color:{{ g.fg }};font-size:13px;font-weight:{{ g.fw }}" style-hover="background:{{ g.hov }};color:#ffffff">
          <span style="flex:none;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:{{ g.icoBg }};color:{{ g.icoFg }}"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="{{ g.icon }}"></path></svg></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ g.label }}</span><sc-if value="{{ g.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size:10.5px;color:#8392bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ g.sub }}</span></sc-if></span>
        </button>
      </sc-if>
    </sc-for>
  </nav>
  <div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;line-height:1.45;color:#8392bb">Figures in $MM. Mock data for the prototype.</div>
</aside>
</sc-if>

<sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
<aside aria-label="Components" style="position:sticky;top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);flex:0 0 84px;border-radius:18px;background:linear-gradient(180deg,#1a2b5c,#0f1a3a);display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:10px 6px;overflow-y:auto;z-index:30;box-shadow:0 20px 40px -18px rgba(15,26,58,.55)">
  <sc-for list="{{ rail }}" as="r" hint-placeholder-count="9">
    <sc-if value="{{ r.isHead }}" hint-placeholder-val="{{ false }}"><span style="padding:10px 0 4px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;color:#7f8fbb">{{ r.label }}</span></sc-if>
    <sc-if value="{{ r.isItem }}" hint-placeholder-val="{{ true }}"><button onPointerDown="{{ r.onPress }}" onClick="{{ r.onClick }}" title="{{ r.tip }}" style="touch-action:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;border:0;border-radius:12px;background:transparent;color:#c9d4f2;cursor:grab;font-size:10.5px;font-weight:600;line-height:1.15;text-align:center" style-hover="background:rgba(255,255,255,.08);color:#ffffff"><span style="width:34px;height:34px;border-radius:10px;background:rgba(91,134,245,.18);display:flex;align-items:center;justify-content:center;color:#a9c0ff"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="{{ r.icon }}"></path></svg></span>{{ r.label }}</button></sc-if>
  </sc-for>
</aside>
</sc-if>

<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;padding:0 18px 0 16px">
<div style="position:{{ hdrPos }};top:0;z-index:40;margin:0 -18px 4px -16px;padding:12px 18px 10px 16px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(238,242,249,.96),rgba(238,242,249,.88));backdrop-filter:saturate(170%) blur(14px);-webkit-backdrop-filter:saturate(170%) blur(14px)">
<header style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
  <div style="display:flex;flex-direction:column;gap:3px;min-width:220px;flex:1 1 260px">
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#667085;white-space:nowrap"><span>My dashboards</span><span style="color:#b0b8c6">/</span><span>{{ crumb }}</span></div>
    <div style="display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap">
      <sc-if value="{{ isView }}" hint-placeholder-val="{{ true }}"><h1 style="margin:0;white-space:nowrap;font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#0f1a3a">{{ dashName }}</h1></sc-if>
      <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}"><label style="display:flex"><span class="vh">Dashboard name</span><input value="{{ dashName }}" onChange="{{ onName }}" style="width:300px;height:36px;padding:0 12px;border:1px solid #bcd0f5;border-radius:10px;background:#fff;font-size:18px;font-weight:700;color:#0f1a3a"></label></sc-if>
      <span title="{{ dsTip }}" style="display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:#fff;border:1px solid #dbe4f6;font-size:11.5px;font-weight:600;color:#1d4596;white-space:nowrap"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>{{ dsName }}</span>
      <sc-if value="{{ hdrView }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ openHistory }}" title="Version history" style="display:flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;background:#fff;border:1px solid #e2e8f2;font-size:11px;font-weight:600;color:#475467;cursor:pointer;font-family:'IBM Plex Mono',monospace" style-hover="border-color:#bcd0f5;color:#1d4596">{{ verLabel }}</button>
        <span style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#667085;white-space:nowrap"><span style="width:7px;height:7px;border-radius:50%;background:{{ saveDot }}"></span>{{ saveNote }}</span>
      </sc-if>
    </div>
  </div>
  <div style="flex:0 1 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px;margin-left:auto">
    <div style="display:flex;align-items:center;gap:2px;height:42px;padding:0 4px;background:#fff;border:1px solid #e2e8f2;border-radius:12px;color:#2f62c9">
      <button onClick="{{ cobPrev }}" aria-label="Previous COB" style="width:26px;height:30px;border:0;border-radius:8px;background:transparent;color:#475467;cursor:pointer" style-hover="background:#f3f6fc">‹</button>
      <span style="display:flex;flex-direction:column;gap:1px;padding:0 4px"><span style="font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#667085">COB</span><span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:#101828">{{ cobLabel }}</span></span>
      <button onClick="{{ cobNext }}" aria-label="Next COB" style="width:26px;height:30px;border:0;border-radius:8px;background:transparent;color:#475467;cursor:pointer" style-hover="background:#f3f6fc">›</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;background:#fff;border:1px solid #e2e8f2;border-radius:12px"><span style="display:flex;flex-direction:column;gap:1px"><span style="font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#667085">PCOB · {{ compare }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:#101828">{{ pcobLabel }}</span></span></div>
    <sc-if value="{{ hdrView }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ openJson }}" style="display:flex;align-items:center;gap:7px;height:42px;padding:0 12px;border:1px solid #e2e8f2;background:#fff;color:#475467;border-radius:12px;cursor:pointer;font-size:12.5px;font-weight:600" style-hover="color:#2f62c9;border-color:#bcd0f5"><span style="font-family:'IBM Plex Mono',monospace">{ }</span>JSON</button>
      <button onClick="{{ startEdit }}" disabled="{{ isPreview }}" style="display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border:0;border-radius:12px;background:linear-gradient(180deg,#2c4ea3,#1a2b5c);color:#fff;font-size:13px;font-weight:600;cursor:pointer;opacity:{{ editOp }};box-shadow:0 8px 18px -8px rgba(26,43,92,.7)" style-hover="filter:brightness(1.08)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Edit</button>
    </sc-if>
    <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;gap:2px;padding:3px;background:#fff;border:1px solid #e2e8f2;border-radius:12px">
        <button onClick="{{ undo }}" disabled="{{ noUndo }}" aria-label="Undo" title="Undo (Ctrl+Z)" style="width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#475467;cursor:pointer;opacity:{{ undoOp }}" style-hover="background:#f3f6fc"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"></path></svg></button>
        <button onClick="{{ redo }}" disabled="{{ noRedo }}" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" style="width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:#475467;cursor:pointer;opacity:{{ redoOp }}" style-hover="background:#f3f6fc"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="m15 14 5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"></path></svg></button>
      </div>
      <span style="font-size:12px;color:#667085;white-space:nowrap">{{ draftNote }}</span>
      <button onClick="{{ cancelEdit }}" style="height:42px;padding:0 14px;border:1px solid #e2e8f2;border-radius:12px;background:#fff;color:#344054;font-size:13px;font-weight:600;cursor:pointer">Cancel</button>
      <button onClick="{{ save }}" style="display:flex;align-items:center;gap:7px;height:42px;padding:0 18px;border:0;border-radius:12px;background:linear-gradient(180deg,#2c4ea3,#1a2b5c);color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 8px 18px -8px rgba(26,43,92,.7)"><sc-if value="{{ saving }}" hint-placeholder-val="{{ false }}"><span style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:omSpin .7s linear infinite"></span></sc-if>{{ saveLabel }}</button>
    </sc-if>
  </div>
</header>
<sc-if value="{{ isPreview }}" hint-placeholder-val="{{ false }}"><div role="status" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#fff7e6;border:1px solid #fedf89;color:#93370d;font-size:13px"><b>Previewing {{ previewLabel }}</b><span>Read-only.</span><span style="flex:1"></span><button onClick="{{ exitPreview }}" style="height:32px;padding:0 12px;border:1px solid #fedf89;border-radius:9px;background:#fff;color:#93370d;font-weight:600;cursor:pointer">Back to current</button><button onClick="{{ restorePreview }}" style="height:32px;padding:0 14px;border:0;border-radius:9px;background:#b54708;color:#fff;font-weight:600;cursor:pointer">Restore this version</button></div></sc-if>

<sc-if value="{{ showTop }}" hint-placeholder-val="{{ true }}">
<div data-top="1" onClick="{{ topClick }}" style="background:radial-gradient(600px 120px at 0 0,rgba(91,134,245,.22) 0,rgba(91,134,245,0) 70%),linear-gradient(180deg,#1a2b5c,#101c40);border:1px {{ topBdStyle }} {{ topBd }};border-radius:18px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;box-shadow:0 18px 36px -18px rgba(15,26,58,.75)">
  <sc-if value="{{ topEmpty }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#8fa0cc;padding:8px 6px">Top bar · add filters here</span></sc-if>
  <sc-for list="{{ topItems }}" as="it" hint-placeholder-count="3">
    <sc-if value="{{ it.isFilter }}" hint-placeholder-val="{{ true }}">
      <div data-cid="{{ it.id }}" onClick="{{ it.onSelect }}" style="display:flex;align-items:center;gap:10px;padding:3px 10px 3px 3px;min-height:38px;border-radius:12px;background:{{ it.secBg }};border:1px solid {{ it.secBd }};box-shadow:{{ it.ring }}">
        <span onPointerDown="{{ it.onGrip }}" title="{{ it.tip }}" style="align-self:stretch;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:9px;background:rgba(91,134,245,.16);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a9c0ff;white-space:nowrap;cursor:{{ it.cur }}">{{ it.label }}<sc-if value="{{ it.showCount }}" hint-placeholder-val="{{ false }}"><span style="min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:#5b86f5;color:#fff;font-size:10px;letter-spacing:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace">{{ it.count }}</span></sc-if></span>
        <div style="display:flex;flex-wrap:wrap;gap:2px;padding:2px;background:rgba(6,14,38,.38);border:1px solid rgba(255,255,255,.07);border-radius:10px"><sc-for list="{{ it.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="border:0;height:28px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};box-shadow:{{ o.sh }}" style-hover="color:#ffffff">{{ o.label }}</button></sc-for></div>
        <sc-if value="{{ it.canRemove }}" hint-placeholder-val="{{ false }}"><button onClick="{{ it.onRemove }}" aria-label="Remove filter" title="Remove this filter" style="width:26px;height:26px;margin-left:-4px;border:0;border-radius:8px;background:transparent;color:#8fa0cc;cursor:pointer;font-size:12px" style-hover="background:rgba(240,68,56,.22);color:#fecdca">✕</button></sc-if>
      </div>
    </sc-if>
    <sc-if value="{{ it.isButton }}" hint-placeholder-val="{{ false }}"><div data-cid="{{ it.id }}" onClick="{{ it.onSelect }}" style="border-radius:12px;box-shadow:{{ it.ring }}"><button onClick="{{ it.onClick }}" onPointerDown="{{ it.onGrip }}" title="{{ it.tip }}" style="display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;border:1px solid {{ it.bd }};background:{{ it.bg }};color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ it.icon }}"></path></svg>{{ it.label }}</button></div></sc-if>
    <sc-if value="{{ it.isChips }}" hint-placeholder-val="{{ false }}">
      <div data-cid="{{ it.id }}" onClick="{{ it.onSelect }}" style="order:2;flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:34px;padding:4px 6px;border-top:1px solid rgba(255,255,255,.07);margin-top:2px;border-radius:10px;box-shadow:{{ it.ring }}">
        <span onPointerDown="{{ it.onGrip }}" style="display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.09em;color:#8fa6e0;white-space:nowrap;cursor:{{ it.cur }}"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 5h16l-6 8v6l-4-2v-4L4 5z"></path></svg>CROSS-FILTERS</span>
        <sc-if value="{{ it.none }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;color:#8fa0cc">Click a row, bar or cell to filter the rest of the dashboard</span></sc-if>
        <sc-for list="{{ it.chips }}" as="c" hint-placeholder-count="0"><div title="{{ c.tip }}" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 10px;background:#fff;border-radius:999px;animation:omFade .2s ease both"><span style="font-size:10px;color:#2f62c9;font-weight:700;letter-spacing:.06em">{{ c.kind }}</span><span style="font-size:12.5px;font-weight:600;color:#0f1a3a">{{ c.value }}</span><span style="font-size:11px;color:#667085">→ {{ c.applies }}</span><button onClick="{{ c.clear }}" aria-label="Remove cross-filter" style="width:22px;height:22px;border-radius:50%;border:0;background:#eef3fd;color:#2f62c9;cursor:pointer">×</button></div></sc-for>
        <span style="flex:1"></span>
        <sc-if value="{{ it.any }}" hint-placeholder-val="{{ false }}"><button onClick="{{ it.clearAll }}" style="border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#dbe4fb;font-size:12px;font-weight:600;cursor:pointer;height:28px;padding:0 12px;border-radius:999px">Clear all</button></sc-if>
      </div>
    </sc-if>
  </sc-for>
  <sc-if value="{{ topAddClosed }}" hint-placeholder-val="{{ false }}"><button onClick="{{ topAddOpen }}" style="order:1;height:34px;padding:0 12px;border:1px dashed rgba(143,176,251,.6);border-radius:10px;background:transparent;color:#a9c0ff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="background:rgba(255,255,255,.08);color:#ffffff">＋ Add filter</button></sc-if>
  <sc-if value="{{ topAddIsOpen }}" hint-placeholder-val="{{ false }}"><div style="order:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:3px 3px 3px 10px;border-radius:12px;background:rgba(91,134,245,.16);border:1px solid rgba(143,176,251,.45);animation:omFade .15s ease both"><span style="font-size:10px;font-weight:700;letter-spacing:.09em;color:#a9c0ff;margin-right:4px">ADD FILTER ON</span><sc-for list="{{ topAddOpts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="height:28px;padding:0 10px;border:0;border-radius:8px;background:#ffffff;color:#0f1a3a;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="background:#dbe6fb">＋ {{ o.label }}</button></sc-for><sc-if value="{{ topAddNone }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#b9c6e6">Every field already has a filter</span></sc-if><button onClick="{{ topAddClose }}" aria-label="Close" title="Close (Esc)" style="width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#b9c6e6;cursor:pointer">✕</button></div></sc-if>
</div>
</sc-if>
</div>

<sc-if value="{{ showMain }}" hint-placeholder-val="{{ true }}">
<main data-main="1" onClick="{{ mainClick }}" style="display:flex;flex-direction:column;padding:{{ mainPad }};margin:8px 0 24px;border-radius:20px;background:{{ mainBg }};min-height:300px">
  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}"><section style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:60px 20px;text-align:center"><b style="font-size:17px;color:#0f1a3a">{{ emptyTitle }}</b><span style="font-size:13px;color:#475467;max-width:460px;line-height:1.5">{{ emptyNote }}</span><sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}"><button onClick="{{ emptyAdd }}" style="margin-top:6px;display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid #bcd0f5;border-radius:10px;background:#eef3fd;color:#1d4596;font-size:13px;font-weight:600;cursor:pointer">＋ Add a component</button></sc-if></section></sc-if>

  <sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
  <sc-if value="{{ row.isPicker }}" hint-placeholder-val="{{ false }}">
    <section aria-label="Add a component" style="margin:12px 0 4px;padding:12px;border:2px dashed #8fb0fb;border-radius:16px;background:rgba(255,255,255,.9);display:flex;flex-direction:column;gap:10px;animation:omUp .16s ease both">
      <div style="display:flex;align-items:center;gap:8px"><b style="font-size:13px;color:#0f1a3a">Add a component</b><span style="font-size:12px;color:#667085">to {{ row.pkWhere }}</span><span style="flex:1"></span><button onClick="{{ row.pkClose }}" style="height:28px;padding:0 10px;border:1px solid #e2e8f2;border-radius:8px;background:#fff;color:#475467;font-size:12px;font-weight:600;cursor:pointer">Cancel</button></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px"><sc-for list="{{ row.pkItems }}" as="o" hint-placeholder-count="6"><button onClick="{{ o.onClick }}" style="display:flex;align-items:center;gap:9px;padding:9px;border:1px solid #e2e8f2;border-radius:11px;background:#fff;cursor:pointer;text-align:left" style-hover="border-color:#5b86f5;background:#f5f8ff"><span style="flex:none;width:30px;height:30px;border-radius:9px;background:#eef3fd;color:#2f62c9;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="{{ o.icon }}"></path></svg></span><span style="display:flex;flex-direction:column;gap:1px;min-width:0"><b style="font-size:12.5px;color:#101828">{{ o.label }}</b><span style="font-size:11px;color:#667085;line-height:1.3">{{ o.desc }}</span></span></button></sc-for></div>
    </section>
  </sc-if>
  <sc-if value="{{ row.isRow }}" hint-placeholder-val="{{ true }}">
    <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
      <div style="position:relative;height:22px;display:flex;align-items:center;opacity:0;transition:opacity .15s ease" style-hover="opacity:1">
        <span style="flex:1;height:2px;background:#5b86f5;border-radius:2px"></span>
        <button onClick="{{ row.onInsert }}" title="Insert a new row here" style="flex:none;margin:0 8px;height:22px;padding:0 10px;border:0;border-radius:999px;background:#2f62c9;color:#fff;font-size:11.5px;font-weight:600;cursor:pointer;box-shadow:0 4px 10px -4px rgba(47,98,201,.7)">＋ Row</button>
        <span style="flex:1;height:2px;background:#5b86f5;border-radius:2px"></span>
      </div>
    </sc-if>
    <sc-if value="{{ isView }}" hint-placeholder-val="{{ true }}"><div style="height:14px"></div></sc-if>
    <section data-row="{{ row.idx }}" style="position:relative;display:flex;flex-wrap:wrap;gap:14px;align-items:stretch">
      <sc-if value="{{ row.showCols }}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position:absolute;inset:-6px 0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;pointer-events:none"><sc-for list="{{ row.cols }}" as="cl" hint-placeholder-count="12"><span style="border-radius:8px;background:rgba(91,134,245,.09);border:1px dashed rgba(91,134,245,.35)"></span></sc-for></div></sc-if>
      <sc-for list="{{ row.cards }}" as="c" hint-placeholder-count="2">
        <div data-cid="{{ c.id }}" onClick="{{ c.onSelect }}" style="position:relative;flex:{{ c.flex }};min-width:{{ c.minW }}px;max-width:100%;background:{{ c.bg }};border:1px {{ c.bdStyle }} {{ c.bd }};border-radius:16px;box-shadow:{{ c.sh }};display:flex;flex-direction:column;opacity:{{ c.op }};transition:box-shadow .15s ease,opacity .15s ease" style-hover="{{ c.hov }}">
          <sc-if value="{{ c.selected }}" hint-placeholder-val="{{ false }}">
            <div style="position:absolute;left:10px;top:-40px;z-index:20;display:flex;align-items:center;gap:2px;padding:3px;border-radius:11px;background:#0f1a3a;box-shadow:0 12px 26px -10px rgba(15,26,58,.6);animation:omUp .14s ease both">
              <span onPointerDown="{{ c.onGrip }}" title="Drag to move" style="display:flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 6px;border-radius:8px;color:#c9d4f2;font-size:11.5px;font-weight:600;cursor:grab;touch-action:none;white-space:nowrap" style-hover="background:rgba(255,255,255,.1)"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>{{ c.kLabel }}</span>
              <span style="width:1px;height:18px;background:rgba(255,255,255,.14);margin:0 2px"></span>
              <sc-for list="{{ c.spans }}" as="o" hint-placeholder-count="5"><button onClick="{{ o.onClick }}" title="{{ o.tip }}" style="min-width:28px;height:28px;padding:0 5px;border:0;border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button></sc-for>
              <span style="width:1px;height:18px;background:rgba(255,255,255,.14);margin:0 2px"></span>
              <button onClick="{{ c.onLeft }}" aria-label="Move left" title="Move left (Alt+←)" style="width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#c9d4f2;cursor:pointer" style-hover="background:rgba(255,255,255,.1)">‹</button>
              <button onClick="{{ c.onRight }}" aria-label="Move right" title="Move right (Alt+→)" style="width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#c9d4f2;cursor:pointer" style-hover="background:rgba(255,255,255,.1)">›</button>
              <button onClick="{{ c.onUp }}" aria-label="Move to row above" title="Move to row above (Alt+↑)" style="width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#c9d4f2;cursor:pointer;font-size:11px" style-hover="background:rgba(255,255,255,.1)">▲</button>
              <button onClick="{{ c.onDown }}" aria-label="Move to row below" title="Move to row below (Alt+↓)" style="width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#c9d4f2;cursor:pointer;font-size:11px" style-hover="background:rgba(255,255,255,.1)">▼</button>
              <button onClick="{{ c.onDup }}" aria-label="Duplicate" title="Duplicate (Ctrl+D)" style="width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#c9d4f2;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(255,255,255,.1)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M9 9h11v11H9zM5 15H4V4h11v1"></path></svg></button>
              <button onClick="{{ c.onDel }}" aria-label="Delete" title="Delete (Del)" style="width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#fda29b;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(240,68,56,.2)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
            </div>
            <div onPointerDown="{{ c.onRzW }}" title="Drag to change the width (snaps to 12 columns)" style="position:absolute;top:50%;right:-8px;transform:translateY(-50%);z-index:22;width:14px;height:48px;border-radius:7px;background:#ffffff;border:2px solid #2f62c9;cursor:ew-resize;touch-action:none;box-shadow:0 4px 10px -4px rgba(47,98,201,.6);display:flex;align-items:center;justify-content:center"><span style="width:2px;height:18px;border-radius:2px;background:#8fb0fb"></span></div>
            <sc-if value="{{ c.canRzH }}" hint-placeholder-val="{{ false }}"><div onPointerDown="{{ c.onRzH }}" title="Drag to change the height" style="position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);z-index:22;width:48px;height:14px;border-radius:7px;background:#ffffff;border:2px solid #2f62c9;cursor:ns-resize;touch-action:none;box-shadow:0 4px 10px -4px rgba(47,98,201,.6);display:flex;align-items:center;justify-content:center"><span style="width:18px;height:2px;border-radius:2px;background:#8fb0fb"></span></div></sc-if>
            <sc-if value="{{ c.rzOn }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;right:12px;top:10px;z-index:23;padding:3px 9px;border-radius:8px;background:#0f1a3a;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600">{{ c.rzLabel }}</span></sc-if>
          </sc-if>
          <sc-if value="{{ c.isHeader }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:{{ c.hdrPad }}"><h2 style="margin:0;font-size:17px;font-weight:700;color:#0f1a3a;white-space:nowrap">{{ c.title }}</h2><span style="flex:1;height:1px;background:linear-gradient(90deg,#c9d4e8,rgba(201,212,232,0))"></span></div></sc-if>
          <sc-if value="{{ c.isDivider }}" hint-placeholder-val="{{ false }}"><div style="padding:{{ c.hdrPad }}"><div style="height:1px;background:#dfe5ef"></div></div></sc-if>
          <sc-if value="{{ c.isCard }}" hint-placeholder-val="{{ true }}">
            <div onPointerDown="{{ c.onHeadPress }}" style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;padding:14px 16px 10px;cursor:{{ c.headCur }}">
              <div style="display:flex;flex-direction:column;gap:5px;min-width:0;flex:1">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0;font-size:15px;font-weight:600;color:#101828">{{ c.title }}</h2><sc-if value="{{ c.loading }}" hint-placeholder-val="{{ false }}"><span title="Loading from the service" style="width:12px;height:12px;border-radius:50%;border:2px solid #c9d7f5;border-top-color:#2f62c9;animation:omSpin .7s linear infinite"></span></sc-if></div>
                <sc-if value="{{ c.hasSub }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;color:#667085">{{ c.sub }}</span></sc-if>
                <sc-if value="{{ c.hasChips }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:5px"><sc-for list="{{ c.chips }}" as="ch" hint-placeholder-count="1"><span title="{{ ch.tip }}" style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{ ch.bg }};color:{{ ch.fg }};border:1px solid {{ ch.bd }};white-space:nowrap">{{ ch.label }}</span></sc-for></div></sc-if>
              </div>
              <sc-if value="{{ c.showExport }}" hint-placeholder-val="{{ true }}"><button onClick="{{ c.onExport }}" aria-label="Export data" title="Export CSV" style="width:32px;height:32px;border-radius:10px;border:1px solid #e6ebf3;background:#fff;color:#667085;cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="color:#2f62c9;border-color:#bcd0f5"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg></button></sc-if>
            </div>
          </sc-if>
          <sc-if value="{{ c.isSkel }}" hint-placeholder-val="{{ false }}"><div style="height:{{ c.bodyH }};padding:6px 16px 16px;display:flex;flex-direction:column;gap:9px"><div class="sk" style="height:26px"></div><div class="sk" style="height:18px;width:92%"></div><div class="sk" style="height:18px;width:84%"></div><div class="sk" style="height:18px;width:88%"></div><div class="sk" style="height:18px;width:70%"></div><span style="font-size:11.5px;color:#98a2b3">Querying the service…</span></div></sc-if>
          <sc-if value="{{ c.isNoQuery }}" hint-placeholder-val="{{ false }}"><div style="padding:4px 16px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start"><span style="font-size:12.5px;color:#475467;line-height:1.5">{{ c.noQueryNote }}</span><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ c.quick }}" as="q" hint-placeholder-count="3"><button onClick="{{ q.onClick }}" style="height:30px;padding:0 11px;border:1px solid #bcd0f5;border-radius:9px;background:#eef3fd;color:#1d4596;font-size:12px;font-weight:600;cursor:pointer">{{ q.label }}</button></sc-for></div></div></sc-if>
          <sc-if value="{{ c.isText }}" hint-placeholder-val="{{ false }}"><div style="padding:0 16px 16px;font-size:13.5px;line-height:1.6;color:#344054;white-space:pre-line">{{ c.text }}</div></sc-if>

          <sc-if value="{{ c.isStat }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:4px;padding:14px 16px;height:100%;box-shadow:inset 0 2px 0 {{ c.st.accent }}">
              <span style="font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#667085;text-transform:uppercase">{{ c.title }}</span>
              <b style="font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#0f1a3a">{{ c.st.val }}</b>
              <span style="font-size:12px;font-weight:600;color:{{ c.st.subFg }}">{{ c.st.sub }}</span>
              <sc-if value="{{ c.hasChips }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:2px"><sc-for list="{{ c.chips }}" as="ch" hint-placeholder-count="1"><span title="{{ ch.tip }}" style="font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:{{ ch.bg }};color:{{ ch.fg }};border:1px solid {{ ch.bd }};white-space:nowrap">{{ ch.label }}</span></sc-for></div></sc-if>
            </div>
          </sc-if>

          <sc-if value="{{ c.isFilter }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px">
              <span style="font-size:10.5px;font-weight:700;letter-spacing:.09em;color:#475467;text-transform:uppercase">{{ c.fl.label }}</span>
              <div style="display:flex;flex-wrap:wrap;gap:2px;padding:3px;background:#fff;border:1px solid #e2e8f2;border-radius:11px;box-shadow:0 1px 2px rgba(16,24,40,.05)"><sc-for list="{{ c.fl.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="border:0;height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;background:{{ o.lbg }};color:{{ o.lfg }}">{{ o.label }}</button></sc-for></div>
              <span style="font-size:11px;color:#667085">{{ c.fl.scopeNote }}</span>
            </div>
          </sc-if>

          <sc-if value="{{ c.isButton }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;align-items:center;justify-content:{{ c.bt.align }};padding:8px 6px;height:100%"><button onClick="{{ c.bt.onClick }}" title="{{ c.bt.tip }}" style="display:flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;border:1px solid {{ c.bt.bd }};background:{{ c.bt.bg }};color:{{ c.bt.fg }};font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:{{ c.bt.sh }}" style-hover="filter:brightness(1.06)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ c.bt.icon }}"></path></svg>{{ c.bt.label }}</button></div>
          </sc-if>

          <sc-if value="{{ c.isChips }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 16px 14px">
              <sc-if value="{{ c.cx.none }}" hint-placeholder-val="{{ true }}"><span style="font-size:12.5px;color:#667085">{{ c.cx.hint }}</span></sc-if>
              <sc-for list="{{ c.cx.chips }}" as="x" hint-placeholder-count="0"><span style="display:flex;align-items:center;gap:7px;height:30px;padding:0 4px 0 10px;border-radius:999px;background:#eef3fd;border:1px solid #c9d7f5"><span style="width:8px;height:8px;border-radius:3px;background:{{ x.dot }}"></span><b style="font-size:10px;color:#2f62c9;letter-spacing:.06em">{{ x.kind }}</b><span style="font-size:12.5px;font-weight:600;color:#0f1a3a">{{ x.value }}</span><button onClick="{{ x.clear }}" aria-label="Remove cross-filter" style="width:22px;height:22px;border-radius:50%;border:0;background:#fff;color:#2f62c9;cursor:pointer">×</button></span></sc-for>
            </div>
          </sc-if>

          <sc-if value="{{ c.isKpi }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:9px;padding:{{ c.kpPad }}">
              <div onPointerDown="{{ c.onHeadPress }}" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:{{ c.headCur }}">
                <span style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#667085">{{ c.title }}</span>
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:#e9eef7;color:#475467">{{ c.kp.count }}</span>
                <span style="font-size:11.5px;color:#98a2b3">{{ c.kp.cmpNote }}</span>
                <sc-if value="{{ c.loading }}" hint-placeholder-val="{{ false }}"><span title="Loading from the service" style="width:12px;height:12px;border-radius:50%;border:2px solid #c9d7f5;border-top-color:#2f62c9;animation:omSpin .7s linear infinite"></span></sc-if>
                <sc-for list="{{ c.chips }}" as="ch" hint-placeholder-count="0"><span title="{{ ch.tip }}" style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{ ch.bg }};color:{{ ch.fg }};border:1px solid {{ ch.bd }};white-space:nowrap">{{ ch.label }}</span></sc-for>
                <span style="flex:1"></span>
                <sc-for list="{{ c.kp.sums }}" as="sm" hint-placeholder-count="0"><span style="display:flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:{{ sm.bg }};color:{{ sm.fg }}"><span style="width:7px;height:7px;border-radius:50%;background:{{ sm.dot }}"></span>{{ sm.label }}</span></sc-for>
              </div>
              <div style="display:grid;grid-template-columns:{{ c.kp.gtc }};gap:12px">
                <sc-for list="{{ c.kp.cards }}" as="k" hint-placeholder-count="4">
                  <article title="{{ k.tip }}" style="display:flex;flex-direction:column;gap:8px;min-width:0;padding:13px 14px 12px;background:{{ k.tint }};border:1px solid #e6ebf3;border-radius:14px;box-shadow:inset 0 2px 0 {{ k.accent }},0 1px 2px rgba(16,24,40,.04),0 10px 26px -16px rgba(20,34,74,.2)">
                    <div style="display:flex;align-items:center;gap:6px;min-width:0"><span style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#475467;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">{{ k.label }}</span><span style="font-size:10.5px;font-weight:600;color:#98a2b3;white-space:nowrap">{{ k.unit }}</span><span style="flex:1"></span><sc-if value="{{ k.hasSt }}" hint-placeholder-val="{{ false }}"><span style="display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:999px;font-size:10px;font-weight:700;background:{{ k.stBg }};color:{{ k.stFg }};border:1px solid {{ k.stBd }};white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:currentColor"></span>{{ k.stLabel }}</span></sc-if></div>
                    <sc-if value="{{ k.isFull }}" hint-placeholder-val="{{ true }}"><b style="font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;line-height:1.05;letter-spacing:-.02em;color:#101828;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ k.val }}</b><div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px"><sc-if value="{{ k.hasDelta }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;white-space:nowrap;background:{{ k.dBg }};color:{{ k.dFg }}">{{ k.delta }}</span></sc-if><span style="font-size:11.5px;color:#667085;white-space:nowrap">{{ k.sub }}</span></div></sc-if>
                    <sc-if value="{{ k.isCompact }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><b style="font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:#101828;white-space:nowrap">{{ k.val }}</b><span style="display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;white-space:nowrap;background:{{ k.dBg }};color:{{ k.dFg }}">{{ k.deltaC }}</span></div></sc-if>
                    <sc-if value="{{ k.hasRows }}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding-top:8px;border-top:1px dashed #e6ebf3"><sc-for list="{{ k.rows }}" as="r" hint-placeholder-count="4"><span style="font-size:11px;color:#667085;white-space:nowrap">{{ r.k }}</span><span style="text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:{{ r.fg }};white-space:nowrap">{{ r.v }}</span></sc-for></div></sc-if>

    <span style="flex:none;width:34px;height:34px;border-radius:10px;background:#eef3fd;color:#2f62c9;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="{{ insp.icon }}"></path></svg></span>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:10.5px;font-weight:700;letter-spacing:.09em;color:#667085">{{ insp.kind }}</span><b style="font-size:14.5px;color:#0f1a3a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ insp.title }}</b></div>
    <sc-if value="{{ insp.canClose }}" hint-placeholder-val="{{ false }}"><button onClick="{{ insp.onClose }}" title="Deselect (Esc)" aria-label="Deselect" style="width:30px;height:30px;border:1px solid #e6ebf3;border-radius:9px;background:#fff;color:#475467;cursor:pointer">✕</button></sc-if>
  </div>
  <sc-if value="{{ insp.hasTabs }}" hint-placeholder-val="{{ false }}"><div role="tablist" style="display:flex;gap:2px;margin:10px 14px 0;padding:3px;background:#f3f6fc;border-radius:11px"><sc-for list="{{ insp.tabs }}" as="o" hint-placeholder-count="3"><button role="tab" onClick="{{ o.onClick }}" style="flex:1;height:30px;border:0;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};box-shadow:{{ o.sh }}">{{ o.label }}</button></sc-for></div></sc-if>
  <div style="flex:1;overflow:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:9px">
    <sc-for list="{{ insp.sections }}" as="sec" hint-placeholder-count="4">
      <sc-if value="{{ sec.hasLabel }}" hint-placeholder-val="{{ true }}"><span style="font-size:10.5px;font-weight:700;letter-spacing:.09em;color:#667085;padding-top:4px">{{ sec.label }}</span></sc-if>
      <sc-if value="{{ sec.isZone }}" hint-placeholder-val="{{ false }}"><div data-zone="{{ sec.zone }}" style="display:flex;flex-direction:column;gap:7px;padding:9px 10px;border-radius:12px;border:1.5px dashed {{ sec.bd }};background:{{ sec.bg }}">
        <div style="display:flex;align-items:center;gap:6px"><span style="font-size:10.5px;font-weight:700;letter-spacing:.09em;color:#475467">{{ sec.label }}</span><span style="font-size:10.5px;color:#98a2b3">{{ sec.hint }}</span><span style="flex:1"></span><button onClick="{{ sec.onAdd }}" title="{{ sec.addTip }}" style="height:22px;padding:0 8px;border:1px solid #dbe4f6;border-radius:7px;background:#fff;color:#2f62c9;font-size:11.5px;font-weight:700;cursor:pointer">＋</button></div>
        <div style="display:flex;flex-wrap:wrap;gap:5px"><sc-for list="{{ sec.chips }}" as="ch" hint-placeholder-count="2"><span style="display:flex;align-items:center;border-radius:8px;background:{{ ch.bg }};border:1px solid {{ ch.bd }};box-shadow:{{ ch.sh }}"><button onClick="{{ ch.onClick }}" title="{{ ch.tip }}" style="height:26px;padding:0 3px 0 9px;border:0;background:transparent;color:{{ ch.fg }};font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap"><span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.8">{{ ch.pre }}</span> {{ ch.label }}</button><button onClick="{{ ch.onRemove }}" aria-label="Remove" style="width:22px;height:26px;border:0;background:transparent;color:{{ ch.fg }};cursor:pointer;opacity:.65">×</button></span></sc-for><sc-if value="{{ sec.empty }}" hint-placeholder-val="{{ false }}"><span style="font-size:11.5px;color:#98a2b3;padding:4px 0">{{ sec.emptyText }}</span></sc-if></div>
      </div></sc-if>
      <sc-if value="{{ sec.isEditBox }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:#f5f8ff;border:1px solid #c9d7f5;animation:omUp .12s ease both"><div style="display:flex;align-items:center;gap:6px"><b style="flex:1;font-size:12.5px;color:#0f1a3a">{{ sec.title }}</b><button onClick="{{ sec.onDone }}" style="height:24px;padding:0 9px;border:0;border-radius:7px;background:#2f62c9;color:#fff;font-size:11.5px;font-weight:600;cursor:pointer">Done</button></div><sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="2"><span style="font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#667085">{{ r.label }}</span><div style="display:flex;flex-wrap:wrap;gap:4px"><sc-for list="{{ r.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="height:28px;padding:0 10px;border-radius:8px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};font-size:12px;font-weight:600;cursor:pointer">{{ o.label }}</button></sc-for></div></sc-for></div></sc-if>
      <sc-if value="{{ sec.isFields }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:6px">
        <label style="display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid #e2e8f2;border-radius:10px;background:#f8fafd;color:#667085"><span class="vh">Search fields</span><input value="{{ sec.q }}" onChange="{{ sec.onQ }}" placeholder="Search fields" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:12.5px;color:#101828"></label>
        <sc-for list="{{ sec.groups }}" as="g" hint-placeholder-count="2"><span style="font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#667085;padding-top:4px">{{ g.label }}</span><div style="display:flex;flex-direction:column;gap:1px"><sc-for list="{{ g.items }}" as="f" hint-placeholder-count="4"><div onPointerDown="{{ f.onPress }}" title="Drag into Group by, Metrics or Filters" style="display:flex;align-items:center;gap:7px;height:32px;padding:0 4px;border-radius:8px;touch-action:none;cursor:grab;user-select:none" style-hover="background:#f3f6fc"><span style="width:18px;height:26px;display:flex;align-items:center;justify-content:center;color:#98a2b3"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></span><span style="flex:none;min-width:24px;height:20px;padding:0 4px;border-radius:6px;background:{{ f.tagBg }};color:{{ f.tagFg }};font-size:10px;font-weight:700;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center">{{ f.tag }}</span><span style="flex:1;min-width:0;font-size:12.5px;font-weight:600;color:#101828;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ f.label }}</span><sc-if value="{{ f.used }}" hint-placeholder-val="{{ false }}"><span style="font-size:9.5px;font-weight:700;color:#067647">IN USE</span></sc-if><button onClick="{{ f.onAdd }}" title="{{ f.addTip }}" aria-label="{{ f.addTip }}" style="width:24px;height:24px;border:1px solid #dbe4f6;border-radius:7px;background:#fff;color:#2f62c9;cursor:pointer">＋</button></div></sc-for></div></sc-for>
      </div></sc-if>
      <sc-if value="{{ sec.isBtn }}" hint-placeholder-val="{{ false }}"><button onClick="{{ sec.onClick }}" style="display:flex;align-items:center;justify-content:center;gap:7px;height:36px;border:1px solid {{ sec.bd }};border-radius:10px;background:{{ sec.bg }};color:{{ sec.fg }};font-size:12.5px;font-weight:600;cursor:pointer">{{ sec.text }}</button></sc-if>
      <sc-if value="{{ sec.isFacts }}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px"><sc-for list="{{ sec.facts }}" as="f" hint-placeholder-count="4"><div style="padding:8px 10px;border-radius:10px;background:#f8fafd;border:1px solid #eef1f6;display:flex;flex-direction:column;gap:2px"><span style="font-size:10px;font-weight:700;letter-spacing:.08em;color:#667085">{{ f.k }}</span><span style="font-size:12px;font-weight:600;color:#101828">{{ f.v }}</span></div></sc-for></div></sc-if>
      <sc-if value="{{ sec.isKeys }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:5px"><sc-for list="{{ sec.keys }}" as="k" hint-placeholder-count="4"><div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#344054"><span style="flex:1">{{ k.label }}</span><span style="border:1px solid #d6dce8;border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:11px">{{ k.key }}</span></div></sc-for></div></sc-if>
      <sc-if value="{{ sec.isPills }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:4px"><sc-for list="{{ sec.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="height:30px;padding:0 11px;border-radius:9px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};font-size:12px;font-weight:600;cursor:pointer">{{ o.label }}</button></sc-for></div></sc-if>
      <sc-if value="{{ sec.isRadio }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:4px"><sc-for list="{{ sec.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:#101828;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left"><span style="flex:none;width:14px;height:14px;border-radius:50%;border:2px solid {{ o.dot }};box-shadow:inset 0 0 0 2px #fff;background:{{ o.fill }}"></span><span style="display:flex;flex-direction:column;gap:1px">{{ o.label }}<span style="font-size:11px;font-weight:500;color:#667085">{{ o.sub }}</span></span></button></sc-for></div></sc-if>
      <sc-if value="{{ sec.isInput }}" hint-placeholder-val="{{ false }}"><label style="display:flex"><span class="vh">{{ sec.label }}</span><input value="{{ sec.value }}" onChange="{{ sec.onChange }}" style="flex:1;height:38px;padding:0 12px;border:1px solid #e2e8f2;border-radius:11px;font-size:13.5px;color:#101828"></label></sc-if>
      <sc-if value="{{ sec.isTextarea }}" hint-placeholder-val="{{ false }}"><label style="display:flex"><span class="vh">{{ sec.label }}</span><textarea value="{{ sec.value }}" onChange="{{ sec.onChange }}" rows="7" style="flex:1;padding:10px 12px;border:1px solid #e2e8f2;border-radius:11px;font-size:13px;line-height:1.5;color:#101828;resize:vertical"></textarea></label></sc-if>
      <sc-if value="{{ sec.isToggle }}" hint-placeholder-val="{{ false }}"><button onClick="{{ sec.onClick }}" role="switch" aria-checked="{{ sec.aria }}" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid #e6ebf3;background:#fff;cursor:pointer;text-align:left"><span style="flex:none;width:36px;height:20px;border-radius:999px;background:{{ sec.track }};position:relative"><span style="position:absolute;top:2px;left:{{ sec.knob }}px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)"></span></span><span style="display:flex;flex-direction:column;gap:2px"><b style="font-size:12.5px;color:#101828">{{ sec.title }}</b><span style="font-size:11.5px;color:#667085">{{ sec.note }}</span></span></button></sc-if>
      <sc-if value="{{ sec.isNote }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;line-height:1.5;color:#475467;padding:10px 12px;border-radius:12px;background:#f8fafd;border:1px solid #e6ebf3">{{ sec.text }}</div></sc-if>
      <sc-if value="{{ sec.isList }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:4px"><sc-if value="{{ sec.empty }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:#667085;padding:4px 0">{{ sec.emptyText }}</span></sc-if><sc-for list="{{ sec.items }}" as="it" hint-placeholder-count="2"><div style="display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border:1px solid #e6ebf3;border-radius:10px;background:#fff" style-hover="border-color:#bcd0f5"><button onClick="{{ it.onClick }}" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;border:0;background:transparent;text-align:left;cursor:pointer;padding:0"><b style="font-size:12.5px;color:#101828">{{ it.label }}</b><span style="font-size:11px;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.sub }}</span></button><button onClick="{{ it.onRemove }}" aria-label="Remove" title="Remove" style="flex:none;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#98a2b3;cursor:pointer" style-hover="background:#fef3f2;color:#b42318">✕</button></div></sc-for></div></sc-if>
      <sc-if value="{{ sec.isOutline }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:6px"><sc-for list="{{ sec.rows }}" as="ro" hint-placeholder-count="2"><div style="display:flex;gap:6px;align-items:stretch;padding:5px;border:1px solid #e6ebf3;border-radius:11px;background:#fbfcfe"><div style="display:flex;flex-direction:column;gap:2px;justify-content:center"><button onClick="{{ ro.onUp }}" disabled="{{ ro.first }}" aria-label="Move row up" style="width:24px;height:20px;border:0;border-radius:6px;background:transparent;color:#667085;cursor:pointer;font-size:9px;opacity:{{ ro.upOp }}" style-hover="background:#eef3fd">▲</button><button onClick="{{ ro.onDown }}" disabled="{{ ro.last }}" aria-label="Move row down" style="width:24px;height:20px;border:0;border-radius:6px;background:transparent;color:#667085;cursor:pointer;font-size:9px;opacity:{{ ro.downOp }}" style-hover="background:#eef3fd">▼</button></div><div style="flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-content:center"><sc-for list="{{ ro.items }}" as="it" hint-placeholder-count="2"><button onClick="{{ it.onClick }}" title="{{ it.tip }}" style="display:flex;align-items:center;gap:5px;height:26px;max-width:100%;padding:0 8px;border:1px solid {{ it.bd }};border-radius:7px;background:{{ it.bg }};color:#344054;font-size:11.5px;font-weight:600;cursor:pointer" style-hover="border-color:#5b86f5;color:#1d4596"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" aria-hidden="true" style="flex:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="{{ it.icon }}"></path></svg><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.label }}</span><span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#98a2b3">{{ it.span }}</span></button></sc-for></div></div></sc-for></div></sc-if>
      <sc-if value="{{ sec.isVersions }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:8px"><sc-for list="{{ sec.versions }}" as="v" hint-placeholder-count="2"><div style="display:flex;flex-direction:column;gap:5px;padding:12px;border-radius:14px;border:1px solid {{ v.bd }};background:{{ v.bg }}"><div style="display:flex;align-items:center;gap:8px"><b style="font-family:'IBM Plex Mono',monospace;font-size:13px">v{{ v.v }}</b><sc-if value="{{ v.isCurrent }}" hint-placeholder-val="{{ false }}"><span style="font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:#dcfae6;color:#067647">CURRENT</span></sc-if><span style="flex:1"></span><span style="font-size:11.5px;color:#667085">{{ v.when }}</span></div><span style="font-size:12.5px;font-weight:600;color:#344054">{{ v.note }}</span><sc-for list="{{ v.changes }}" as="ch" hint-placeholder-count="1"><span style="font-size:12px;color:{{ ch.fg }};font-family:'IBM Plex Mono',monospace">{{ ch.text }}</span></sc-for><sc-if value="{{ v.canAct }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:6px"><button onClick="{{ v.onPreview }}" style="height:28px;padding:0 10px;border:1px solid #e2e8f2;border-radius:8px;background:#fff;font-size:12px;font-weight:600;cursor:pointer">Preview</button><button onClick="{{ v.onRestore }}" style="height:28px;padding:0 10px;border:1px solid #bcd0f5;border-radius:8px;background:#eef3fd;color:#1d4596;font-size:12px;font-weight:600;cursor:pointer">Restore</button></div></sc-if></div></sc-for></div></sc-if>
      <sc-if value="{{ sec.isCode }}" hint-placeholder-val="{{ false }}"><pre style="margin:0;max-height:calc(100vh - 300px);overflow:auto;padding:12px;border-radius:12px;background:#0f1a3a;font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.55;color:#c9d6f5;white-space:pre">{{ sec.text }}</pre></sc-if>
      <sc-if value="{{ sec.isSrc }}" hint-placeholder-val="{{ false }}"><div style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.5;color:#344054;padding:10px 12px;border-radius:12px;background:#f8fafd;border:1px solid #e6ebf3;word-break:break-all;white-space:pre-wrap">{{ sec.text }}</div></sc-if>
      <sc-if value="{{ sec.isParam }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;border:1px solid {{ sec.bd }};background:{{ sec.bg }}">
          <div style="display:flex;align-items:center;gap:8px"><b style="flex:1;font-size:12.5px;color:#101828">{{ sec.name }}</b><span style="font-size:11px;font-weight:600;color:{{ sec.stFg }}">{{ sec.status }}</span></div>
          <sc-if value="{{ sec.hasAction }}" hint-placeholder-val="{{ false }}"><button onClick="{{ sec.onAction }}" style="align-self:flex-start;display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid #bcd0f5;border-radius:8px;background:#eef3fd;color:#1d4596;font-size:12px;font-weight:600;cursor:pointer"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2.6;stroke-linecap:round"><path d="M12 5v14M5 12h14"></path></svg>{{ sec.action }}</button></sc-if>
          <div style="display:flex;flex-wrap:wrap;gap:4px"><sc-for list="{{ sec.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="height:26px;padding:0 9px;border-radius:7px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};font-size:11.5px;font-weight:600;cursor:pointer">{{ o.label }}</button></sc-for></div>
        </div>
      </sc-if>
      <sc-if value="{{ sec.isChecks }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ sec.opts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" disabled="{{ o.locked }}" title="{{ o.tip }}" style="display:flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 7px;border-radius:999px;border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};font-size:12px;font-weight:600;cursor:pointer"><span style="flex:none;width:15px;height:15px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:{{ o.boxBg }};border:1.5px solid {{ o.boxBd }};color:#fff"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round"><path d="M20 6 9 17l-5-5"></path></svg></span>{{ o.label }}</button></sc-for></div></sc-if>
      <sc-if value="{{ sec.isDatasets }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:6px"><sc-for list="{{ sec.opts }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.onClick }}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;border:1px solid {{ o.bd }};background:{{ o.bg }};cursor:pointer;text-align:left"><span style="flex:none;width:14px;height:14px;border-radius:50%;border:2px solid {{ o.dot }};box-shadow:inset 0 0 0 2px #fff;background:{{ o.fill }}"></span><span style="flex:1;display:flex;flex-direction:column;gap:1px"><b style="font-size:12.5px;color:#101828">{{ o.label }}</b><span style="font-size:11px;color:#667085">{{ o.meta }}</span></span><span style="font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:{{ o.tagBg }};color:{{ o.tagFg }}">{{ o.svc }}</span></button></sc-for></div></sc-if>
      <sc-if value="{{ sec.isDsSelect }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <button onClick="{{ sec.onToggle }}" aria-expanded="{{ sec.aria }}" style="display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border:1px solid {{ sec.bd }};border-radius:12px;background:#fff;cursor:pointer;text-align:left;box-shadow:{{ sec.sh }}">
            <span style="flex:none;width:30px;height:30px;border-radius:9px;background:{{ sec.tagBg }};color:{{ sec.tagFg }};display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg></span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-size:11px;color:#667085">{{ sec.curSection }}</span><b style="font-size:13px;color:#101828;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sec.curLabel }}</b></span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#667085" aria-hidden="true" style="flex:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transform:{{ sec.rot }};transition:transform .15s ease"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
