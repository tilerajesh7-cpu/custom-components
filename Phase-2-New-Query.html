<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 2 · New query · Custom Dashboards</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--navy:#0f1a3a;--navy2:#14224a;--navy3:#1a2b5c;--ink:#101828;--ink2:#344054;--mute:#667085;--mute2:#98a2b3;--line:#e6ebf3;--line2:#eef1f6;--acc:#2f62c9;--acc2:#5b86f5;--accBg:#eef3fd;--accBd:#c9d7f5;
--bad:#b42318;--badBg:#fef3f2;--badBd:#fecdca;--good:#067647;--goodBg:#ecfdf3;--goodBd:#abefc6;--warn:#b54708;--warnBg:#fffaeb;--warnBd:#fedf89;--vio:#5925dc;--vioBg:#f4f3ff;--vioBd:#d9d6fe;
--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--sans:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);font-size:13px;color:var(--ink);background:radial-gradient(1100px 520px at 88% -8%,#e2ebff 0,rgba(226,235,255,0) 62%),linear-gradient(180deg,#eef2f9 0,#f4f6fa 520px);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--mute)}
.hide{display:none!important}

/* ---------- app shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:224px;flex:none;background:linear-gradient(180deg,#14224a,#0f1a3a);color:#c9d4f2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:14px 10px;gap:4px;z-index:5}
.side .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px;color:#fff;font-weight:700;font-size:14px}
.side .brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5b86f5,#2f62c9);display:grid;place-items:center;font-style:normal;font-size:11px}
.side .who{font-family:var(--mono);font-size:10.5px;color:#8fa6e0;padding:0 8px 10px}
.side .sec{font-size:10px;font-weight:700;letter-spacing:.1em;color:#7d8bb3;padding:12px 10px 4px}
.side a,.side button.nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:#b9c6e6;text-decoration:none;font-weight:500;border:0;background:transparent;text-align:left;width:100%}
.side a:hover,.side button.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.on{background:linear-gradient(180deg,rgba(91,134,245,.32),rgba(91,134,245,.18));color:#fff;font-weight:600}
.side a small{margin-left:auto;font-size:10px;color:#8fa6e0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.crumb{font-size:11.5px;color:var(--mute)}
.crumb b{color:var(--ink2);font-weight:600}

/* phase banner */
.phase{display:flex;align-items:center;gap:10px;padding:7px 18px;background:#0b1430;color:#c9d4f2;font-size:12px;flex-wrap:wrap}
.phase b{color:#fff}
.phase .tag{padding:2px 8px;border-radius:99px;background:rgba(91,134,245,.25);color:#cfdcff;font-weight:700;font-size:10.5px;letter-spacing:.04em}
.phase nav{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.phase nav a{color:#9fb2e3;text-decoration:none;padding:3px 7px;border-radius:6px;font-size:11px;font-weight:600}
.phase nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.phase nav a.on{background:#2f62c9;color:#fff}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:12px;padding:14px 18px 10px;flex-wrap:wrap}
.hdr h1{margin:2px 0 0;font-size:21px;color:var(--navy);letter-spacing:-.01em}
.hdr .title-in{font-size:20px;font-weight:700;color:var(--navy);border:1px solid transparent;border-radius:9px;padding:3px 8px;margin-left:-9px;background:transparent;min-width:240px}
.hdr .title-in:hover{border-color:var(--line)}.hdr .title-in:focus{border-color:var(--acc2);background:#fff;outline:0}
.sp{flex:1}
.btn{height:32px;padding:0 12px;border-radius:9px;border:1px solid #d5ddeb;background:#fff;color:var(--ink2);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#bcd0f5;color:#1d4596}
.btn.pri{background:linear-gradient(180deg,#2c4ea3,#1a2b5c);border-color:#1a2b5c;color:#fff;box-shadow:0 8px 18px -10px rgba(26,43,92,.8)}
.btn.pri:hover{filter:brightness(1.1);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#fff;border-color:var(--line)}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--goodBg);border-color:var(--goodBd);color:var(--good)}
.pill.warn{background:var(--warnBg);border-color:var(--warnBd);color:var(--warn)}
.pill.bad{background:var(--badBg);border-color:var(--badBd);color:var(--bad)}
.pill.acc{background:var(--accBg);border-color:var(--accBd);color:#1d4596}
.pill.vio{background:var(--vioBg);border-color:var(--vioBd);color:var(--vio)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* navy inputs bar (VaR redesign) */
.bar{margin:0 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;border-radius:14px;background:linear-gradient(180deg,#1a2b5c,#14224a);color:#fff;box-shadow:0 14px 30px -20px rgba(15,26,58,.8)}
.bar .lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:#a9c0ff}
.bar .grp{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 9px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.bar .seg{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(6,14,38,.4)}
.bar .seg button{border:0;height:24px;padding:0 9px;border-radius:7px;background:transparent;color:#b9c6e6;font-weight:600;font-size:12px}
.bar .seg button.on{background:#fff;color:var(--navy)}
.bar .cob{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:0 4px}
.bar .arrow{width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:#c9d4f2}
.bar .arrow:hover{background:rgba(255,255,255,.1)}
.bar select,.bar .tree{height:26px;border-radius:7px;border:0;background:rgba(6,14,38,.4);color:#fff;padding:0 8px;font-weight:600;font-size:12px}
.bar select option{color:#101828}
.xf{margin:8px 18px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:30px;padding:6px 12px;border-radius:12px;background:rgba(15,26,58,.92);color:#c9d4f2;font-size:12px}
.xf .chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 4px 0 10px;border-radius:99px;background:#fff;color:var(--navy);font-weight:600}
.xf .chip small{color:#5925dc;font-weight:700;font-size:10px;letter-spacing:.05em}
.xf .chip button{width:18px;height:18px;border-radius:50%;border:0;background:#eef1f6;color:#475467;font-size:11px;line-height:1}

/* ---------- cards / widgets ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 2px 0 #3a6ae6,0 1px 2px rgba(16,24,40,.04),0 12px 28px -16px rgba(20,34,74,.2);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.card.flat{box-shadow:0 1px 2px rgba(16,24,40,.04)}
.whead{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 6px}
.whead h3{margin:0;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whead .sub{font-size:11px;color:var(--mute2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whead .acts{margin-left:auto;display:flex;gap:2px;flex:none}
.whead .acts button{width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--mute2)}
.whead .acts button:hover{background:#f2f4f7;color:var(--ink)}
.wchips{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 6px}
.wchip{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 4px 0 8px;border-radius:99px;font-size:10.5px;font-weight:600;background:var(--vioBg);color:var(--vio);border:1px solid var(--vioBd)}
.wchip.grey{background:#f2f4f7;color:#475467;border-color:#e4e7ec;padding-right:8px}
.wchip.warn{background:var(--warnBg);color:var(--warn);border-color:var(--warnBd);padding-right:8px}
.wchip.good{background:var(--goodBg);color:var(--good);border-color:var(--goodBd);padding-right:8px}
.wchip button{width:16px;height:16px;border:0;border-radius:50%;background:rgba(89,37,220,.12);color:inherit;font-size:10px;line-height:1}
.wbody{flex:1;min-height:0;position:relative;overflow:auto}

/* grid table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{position:sticky;top:0;z-index:1;background:#f8fafd;color:#475467;font-size:11px;font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.num,.tbl td.num{text-align:right}
.tbl th.grp{text-align:center;font-size:10.5px;color:#1d4596;cursor:default;border-bottom:0;padding-bottom:2px}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td.num{font-family:var(--mono)}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#f5f8ff}
.tbl tr.sel td{background:#eef3fd}
.tbl tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tbl tr.tot td{font-weight:700;background:#f8fafd;position:sticky;bottom:0;border-top:1px solid var(--line)}
.neg{color:var(--bad)}
.heat{display:inline-block;min-width:84px;padding:2px 8px;border-radius:6px;text-align:right}
.pager{display:flex;align-items:center;gap:6px;padding:6px 12px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--mute)}

/* kpi */
.kpis{display:grid;gap:12px;padding:4px 14px 14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;background:#fff;box-shadow:inset 0 2px 0 var(--accent,#3a6ae6),0 6px 18px -14px rgba(20,34,74,.3);min-width:0;cursor:pointer}
.kpi.breach{--accent:#d92d20;background:linear-gradient(180deg,#fff7f6,#fff 70px)}
.kpi.warnst{--accent:#f79009}.kpi.okst{--accent:#12b76a}
.kpi.sel{border-color:var(--acc);box-shadow:inset 0 2px 0 var(--accent,#3a6ae6),0 0 0 3px rgba(47,98,201,.18)}
.kpi .kl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#475467;display:flex;gap:6px;align-items:center;min-width:0}
.kpi .kl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .kv{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:6px;font-family:var(--mono);font-size:11.5px;font-weight:600;white-space:nowrap}
.delta.bad{background:var(--badBg);color:var(--bad)}.delta.good{background:var(--goodBg);color:var(--good)}.delta.flat{background:#f2f4f7;color:#475467}
.krows{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding-top:7px;border-top:1px dashed var(--line);font-size:11px}
.krows span{color:var(--mute)}.krows b{font-family:var(--mono);font-weight:500;text-align:right;color:var(--ink2)}
.meter{height:6px;border-radius:99px;background:#eef1f6;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.meter u{position:absolute;top:-3px;bottom:-3px;left:66.6%;width:2px;background:var(--navy);border-radius:2px}

/* states */
.sk{border-radius:7px;background:linear-gradient(90deg,#eef1f6 0,#f6f8fb 40%,#eef1f6 80%);background-size:800px 100%;animation:sh 1.3s linear infinite}
@keyframes sh{0%{background-position:-400px 0}100%{background-position:400px 0}}
.state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;color:#475467;font-size:12.5px}
.state b{color:var(--ink)}
.state.err b{color:var(--bad)}
.state code{font-size:11px;color:var(--mute2)}
.state .req{display:flex;gap:6px;align-items:center}
.state select,.state input{height:30px;border:1px solid #d5ddeb;border-radius:8px;padding:0 8px;background:#fff}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 12px 10px 16px;border-radius:12px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:0 18px 40px -12px rgba(15,26,58,.6);opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:80vw}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:7px;height:26px;padding:0 10px;font-weight:700}

/* panels used by studio */
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 30px -20px rgba(20,34,74,.25)}
.sect{border-top:1px solid var(--line2);padding:12px 14px}
.sect:first-child{border-top:0}
.sect>h4{margin:0 0 8px;font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.sect>h4 .sp{flex:1}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field>span{font-size:11px;font-weight:600;color:#475467}
.inp{height:32px;border:1px solid #d5ddeb;border-radius:9px;padding:0 10px;background:#fff;width:100%}
.inp:focus{border-color:var(--acc2);outline:0;box-shadow:0 0 0 3px rgba(91,134,245,.18)}
textarea.inp{height:auto;padding:8px 10px;min-height:70px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:4px}
.opt{height:28px;padding:0 10px;border:1px solid #e2e8f2;border-radius:8px;background:#fff;color:#475467;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.opt:hover{border-color:#bcd0f5}
.opt.on{border-color:var(--acc);background:var(--accBg);color:#1d4596}
.opt[disabled]{opacity:.4;cursor:not-allowed}
.note{font-size:11.5px;color:var(--mute);line-height:1.5}
.alert{padding:9px 11px;border-radius:10px;font-size:12px;line-height:1.45;border:1px solid}
.alert b{display:block;margin-bottom:2px}
.alert.info{background:var(--accBg);border-color:var(--accBd);color:#1d4596}
.alert.bad{background:var(--badBg);border-color:var(--badBd);color:var(--bad)}
.alert.good{background:var(--goodBg);border-color:var(--goodBd);color:var(--good)}
.alert.warn{background:var(--warnBg);border-color:var(--warnBd);color:var(--warn)}
.alert.vio{background:var(--vioBg);border-color:var(--vioBd);color:var(--vio)}
.alert span{color:#475467}
.code{font-family:var(--mono);font-size:11px;line-height:1.55;background:#0f1a3a;color:#c9d6f5;border-radius:10px;padding:10px 12px;white-space:pre;overflow:auto;max-height:340px;margin:0}
.toggle{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;font-weight:600;color:var(--ink2);font-size:12.5px}
.toggle i{width:30px;height:18px;border-radius:99px;background:#d0d5dd;position:relative;flex:none;transition:.15s}
.toggle i:after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on i{background:var(--acc)}.toggle.on i:after{left:14px}
.toggle small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left;width:100%}
.li:hover{border-color:#bcd0f5}
.li.on{border-color:var(--acc);background:#f5f8ff;box-shadow:0 0 0 2px rgba(47,98,201,.12)}
.li .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.li .t b{font-size:12.5px;color:var(--ink)}
.li .t span{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t code{font-size:10.5px;color:#1d4596}
.kbd{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:#f8fafd;color:#475467}
.phase .steps a.on{background:#5b86f5!important;color:#fff!important;border-color:#5b86f5!important}

.work{display:flex;gap:14px;padding:12px 18px 18px;align-items:flex-start;flex:1;min-height:0}
.lib{width:232px;flex:none;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.lib .grpT{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--mute);padding:10px 14px 4px}
.lib .item{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:2px 8px;padding:8px;border:1px solid transparent;border-radius:11px;background:transparent;text-align:left;touch-action:none}
.lib .item:hover{border-color:#c9d7f5;background:#f5f8ff}
.lib .item .ic{width:32px;height:32px;border-radius:9px;background:var(--accBg);color:var(--acc);display:grid;place-items:center;flex:none}
.lib .item b{display:block;font-size:12.5px}
.lib .item small{display:block;font-size:10.5px;color:var(--mute);line-height:1.3}
.lib .hint{margin:8px 12px 12px;padding:9px 10px;border-radius:10px;background:#f8fafd;font-size:11px;color:var(--mute);line-height:1.45}
.cvwrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.cv{position:relative;min-height:200px}
.cv.edit{background:radial-gradient(#d3dcef 1px,transparent 1px) 0 0/18px 18px;border-radius:16px;outline:1px dashed #cfd9ee;outline-offset:6px}
.cv .guide{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);gap:14px;pointer-events:none;z-index:0}
.cv .guide span{background:rgba(91,134,245,.07);border:1px dashed rgba(91,134,245,.3);border-radius:8px}
.gi{position:absolute;display:flex;transition:left .18s,top .18s,width .18s,height .18s;z-index:1}
.gi.dragging{transition:none;z-index:20;opacity:.92}
.gi>.card{flex:1}
.edit .gi>.card{cursor:default}
.edit .gi:hover>.card{box-shadow:inset 0 2px 0 #3a6ae6,0 0 0 2px #bcd0f5}
.gi.sel>.card{box-shadow:inset 0 2px 0 #3a6ae6,0 0 0 2px var(--acc),0 12px 28px -16px rgba(20,34,74,.35)!important}
.gi.flash>.card{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 5px rgba(91,134,245,.55)}100%{box-shadow:inset 0 2px 0 #3a6ae6,0 1px 2px rgba(16,24,40,.04)}}
.gi .tb{position:absolute;left:0;top:-40px;display:flex;align-items:center;gap:2px;padding:4px;border-radius:11px;background:var(--navy);color:#c9d4f2;box-shadow:0 12px 24px -10px rgba(15,26,58,.6);z-index:30;white-space:nowrap}
.gi .tb button{height:26px;min-width:26px;padding:0 7px;border:0;border-radius:7px;background:transparent;color:#c9d4f2;font-weight:600;font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.gi .tb button:hover{background:rgba(255,255,255,.1);color:#fff}
.gi .tb button.on{background:#5b86f5;color:#fff}
.gi .tb .sep{width:1px;height:16px;background:rgba(255,255,255,.15);margin:0 3px}
.gi .tb .grip{cursor:grab}
.rh{position:absolute;z-index:25;background:#fff;border:2px solid var(--acc);border-radius:6px;touch-action:none}
